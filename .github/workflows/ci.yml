name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# Un PR con varios push seguidos cancela las corridas viejas en vez de encolarlas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificación
    runs-on: ubuntu-latest

    steps:
      # v7 en ambas: las v4 declaran `using: node20` en su manifiesto y el runner
      # ya no soporta ese runtime, así que las forzaba a Node 24 con un aviso de
      # deprecación. Ojo, esto es el Node que ejecuta LAS ACTIONS; el `node-version`
      # de abajo es el Node que ejecuta nuestro código. Son dos capas distintas.
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # NO BLOQUEANTE hasta la Fase 2.
      # Hoy hay 59 errores, casi todos `no-explicit-any` en src/services/,
      # src/types/Database.ts y un require() en tailwind.config.ts. Ese código
      # se elimina al migrar a Next.js, así que corregirlo sería trabajo tirado.
      # Al cerrar la Fase 2 hay que quitar el continue-on-error de acá abajo.
      # Ver MIGRATION_DOCS/ESTADO_Y_PLAN.md, sección 3 (Deuda).
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # NO BLOQUEANTE: informa vulnerabilidades sin frenar el trabajo.
      # Al 2026-08-05: 15 vulnerabilidades (1 crítica en vitest, 9 altas en vite,
      # postcss, undici, ws, lodash…), casi todas devDependencies del stack Vite.
      # Se vuelve bloqueante cuando el árbol de dependencias sea el de Next.js.
      # Ver Q-10 en MIGRATION_DOCS/ESTADO_Y_PLAN.md.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true
