name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# Un PR con varios push seguidos cancela las corridas viejas en vez de encolarlas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificación
    runs-on: ubuntu-latest

    steps:
      # v7 en ambas: las v4 declaran `using: node20` en su manifiesto y el runner
      # ya no soporta ese runtime, así que las forzaba a Node 24 con un aviso de
      # deprecación. Ojo, esto es el Node que ejecuta LAS ACTIONS; el `node-version`
      # de abajo es el Node que ejecuta nuestro código. Son dos capas distintas.
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # BLOQUEANTE desde la tanda 0 de la Fase 2 (2026-08-06).
      #
      # D-7 lo dejó sin bloquear con un motivo concreto: «los 59 errores viven en
      # código que la migración elimina», así que corregirlos sería trabajo
      # tirado. Ese motivo murió en la tanda 0.3, cuando ese código dejó de
      # existir. El diseño lo colocaba en la tanda 4; adelantarlo evita acumular
      # deuda nueva durante tres tandas, que es justo lo que D-7 no quería.
      #
      # El árbol de Next.js sale limpio de lint, así que esto no frena nada hoy.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # SIGUE NO BLOQUEANTE, hasta la tanda 4.
      # El árbol de Vite traía 15 vulnerabilidades (1 crítica en vitest, 9 altas
      # en vite, postcss, undici, ws, lodash…). El de Next.js reporta **0**,
      # medido el 2026-08-06 tras instalarlo. Se deja sin bloquear un poco más
      # a propósito: el árbol acaba de nacer y conviene ver qué reporta cuando
      # las tandas 1 a 3 le añadan dependencias, antes de frenar con ello.
      # Ver Q-10 en MIGRATION_DOCS/ESTADO_Y_PLAN.md.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true
